services:
  nginx:
    image: nginx:alpine-slim
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - wordpress:/var/www/html:ro
    networks:
      - app-network
